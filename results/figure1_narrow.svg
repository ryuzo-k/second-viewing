<svg viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif" role="img" aria-label="Task: an encoding trial shows images A, B and C, then probe B; at test, B was seen twice, C once and E is new.">
<text x="0" y="16" font-size="13" text-anchor="start" >Encoding phase: 140 working-memory trials</text>
<rect x="8" y="30" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="26" y="53" font-size="15" text-anchor="middle" >A</text>
<rect x="54" y="30" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="72" y="53" font-size="15" text-anchor="middle" >B</text>
<rect x="100" y="30" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="118" y="53" font-size="15" text-anchor="middle" >C</text>
<line x1="150" y1="48" x2="220" y2="48" stroke="#000" stroke-width="1" stroke-dasharray="2 3"/>
<text x="185" y="40" font-size="12" text-anchor="middle" >delay</text>
<rect x="230" y="30" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="248" y="53" font-size="15" text-anchor="middle" >B</text>
<text x="80" y="86" font-size="12" text-anchor="middle" >1 or 3 novel images</text>
<text x="248" y="86" font-size="12" text-anchor="middle" >probe: was it shown?</text>
<text x="0" y="112" font-size="12" text-anchor="start" >A probe repeats an image from the same trial</text>
<text x="0" y="128" font-size="12" text-anchor="start" >or from an earlier one. That image has then</text>
<text x="0" y="144" font-size="12" text-anchor="start" >been seen twice.</text>
<line x1="0" y1="162" x2="360" y2="162" stroke="#000" stroke-width="0.5"/>
<text x="0" y="184" font-size="13" text-anchor="start" >Test phase, a median 11 min later: up to 400 images</text>
<rect x="8" y="198" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="26" y="221" font-size="15" text-anchor="middle" >B</text>
<text x="26" y="252" font-size="12" text-anchor="middle" >twice</text>
<rect x="70" y="198" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="88" y="221" font-size="15" text-anchor="middle" >E</text>
<text x="88" y="252" font-size="12" text-anchor="middle" >new</text>
<rect x="132" y="198" width="36" height="36" fill="none" stroke="#000" stroke-width="1"/><text x="150" y="221" font-size="15" text-anchor="middle" >C</text>
<text x="150" y="252" font-size="12" text-anchor="middle" >once</text>
<text x="0" y="278" font-size="12" text-anchor="start" >Old or new, with confidence 1–6.</text>
<text x="0" y="294" font-size="12" text-anchor="start" >Images: 200 new, 140 once, 60 twice.</text>
<text x="0" y="310" font-size="12" text-anchor="start" >Last viewing to test: median 35 min.</text>
</svg>