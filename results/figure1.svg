<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="Times New Roman, Times, serif" role="img" aria-label="Task: an encoding trial shows images A, B and C, then probe B; at test, B was seen twice, C once and E is new.">
<text x="0" y="18" font-size="14" text-anchor="start" >Encoding phase: 140 working-memory trials</text>
<rect x="20" y="36" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="40" y="61" font-size="15" text-anchor="middle" >A</text>
<rect x="72" y="36" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="92" y="61" font-size="15" text-anchor="middle" >B</text>
<rect x="124" y="36" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="144" y="61" font-size="15" text-anchor="middle" >C</text>
<text x="98" y="96" font-size="12" text-anchor="middle" >1 or 3 novel images</text>
<line x1="186" y1="56" x2="262" y2="56" stroke="#000" stroke-width="1" stroke-dasharray="2 3"/>
<text x="224" y="48" font-size="12" text-anchor="middle" >delay</text>
<rect x="272" y="36" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="292" y="61" font-size="15" text-anchor="middle" >B</text>
<text x="292" y="96" font-size="12" text-anchor="middle" >probe: was it shown?</text>
<text x="380" y="50" font-size="12" text-anchor="start" >A probe repeats an image from the same</text>
<text x="380" y="66" font-size="12" text-anchor="start" >trial or from an earlier one. That image</text>
<text x="380" y="82" font-size="12" text-anchor="start" >has then been seen twice.</text>
<line x1="0" y1="122" x2="640" y2="122" stroke="#000" stroke-width="0.5"/>
<text x="0" y="146" font-size="14" text-anchor="start" >Test phase, a median 11 min later: up to 400 images</text>
<rect x="20" y="162" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="40" y="187" font-size="15" text-anchor="middle" >B</text>
<text x="40" y="222" font-size="12" text-anchor="middle" >twice</text>
<rect x="90" y="162" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="110" y="187" font-size="15" text-anchor="middle" >E</text>
<text x="110" y="222" font-size="12" text-anchor="middle" >new</text>
<rect x="160" y="162" width="40" height="40" fill="none" stroke="#000" stroke-width="1"/><text x="180" y="187" font-size="15" text-anchor="middle" >C</text>
<text x="180" y="222" font-size="12" text-anchor="middle" >once</text>
<text x="380" y="176" font-size="12" text-anchor="start" >Old or new, with confidence 1–6.</text>
<text x="380" y="192" font-size="12" text-anchor="start" >Images: 200 new, 140 once, 60 twice.</text>
<text x="380" y="208" font-size="12" text-anchor="start" >Last viewing to test: median 35 min.</text>
</svg>